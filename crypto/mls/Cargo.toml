[package]
name = "tincan-mls"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
publish = false

[dependencies]
# OpenMLS gates its portable time adapter behind `js`; on WASI, web-time and
# getrandom select WASI/std implementations and do not import JavaScript.
openmls = { version = "=0.9.0", features = ["js"] }
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
anyhow = "1"

[profile.release]
strip = true
panic = "abort"
