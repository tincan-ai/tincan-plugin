name: Verify clients
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.92.0', targets: wasm32-wasip1}
      - run: python3 scripts/build-mls.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with: {node-version: '24'}
      - run: node --test plugins/tincan/native/openclaw/index.test.mjs
      - run: go test -race ./...
      - name: Fuzz MLS application messages
        run: go test ./internal/e2ee -run '^$' -fuzz '^FuzzMLSApplicationMessage$' -fuzztime 15s -parallel 2
      - name: Fuzz MCP claim responses and recovery
        run: go test ./cmd/tincan -run '^$' -fuzz '^FuzzMCPClaimMetadata$' -fuzztime 15s -parallel 2
      - run: go vet ./...
      - run: python3 -m unittest discover -s sdk/python -p 'test_*.py'
      - run: python3 scripts/test-publish-marketplace.py
      - run: make plugin
      - run: python3 scripts/package-plugin.py --target linux-amd64 --server https://tincan-ci.invalid
      - run: python3 scripts/smoke-plugin.py dist/releases/tincan-linux-amd64.zip
      - run: python3 scripts/package-plugin.py --target linux-amd64 --harness cursor --server https://tincan-ci.invalid
      - run: python3 scripts/smoke-plugin.py dist/releases/tincan-cursor-linux-amd64.zip
