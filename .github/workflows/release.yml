name: Package and release plugin
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: plugin-package-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: '1.92.0', targets: wasm32-wasip1}
      - run: python3 scripts/build-mls.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify MCP contracts and ownership recovery
        run: |
          go test -race ./cmd/tincan
          go test ./cmd/tincan -run '^$' -fuzz '^FuzzMCPClaimMetadata$' -fuzztime 15s -parallel 2
      - name: Build universal plugin
        env:
          RELEASE_SERVER: https://app.gotincan.com
          RELEASE_TAG: ${{ github.ref_name }}
          IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ "$IS_RELEASE" = true ]; then
            test -n "$RELEASE_SERVER" || { echo 'Set TINCAN_RELEASE_SERVER to the live HTTPS service origin before releasing.'; exit 1; }
            python3 scripts/package-plugin.py --server "$RELEASE_SERVER" --version "${RELEASE_TAG#v}"
            python3 scripts/package-plugin.py --server "$RELEASE_SERVER" --version "${RELEASE_TAG#v}" --harness cursor
            python3 scripts/package-plugin.py --server "$RELEASE_SERVER" --version "${RELEASE_TAG#v}" --harness codex
          else
            python3 scripts/package-plugin.py --server https://tincan.invalid
            python3 scripts/package-plugin.py --server https://tincan.invalid --harness cursor
            python3 scripts/package-plugin.py --server https://tincan.invalid --harness codex
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: universal-plugin
          path: dist/releases/*
          if-no-files-found: error
  smoke:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-15-intel, macos-14, windows-latest, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: universal-plugin
          path: dist/releases
      - uses: actions/setup-node@v4
        if: runner.os == 'Windows'
        with:
          node-version: '24'
      - name: Run shipped plugin without developer runtimes on PATH
        if: runner.os != 'Windows'
        run: python scripts/smoke-plugin.py dist/releases/tincan-plugin.zip --universal
      - name: Exercise native Windows manifest command resolution
        if: runner.os == 'Windows'
        run: python scripts/smoke-plugin.py dist/releases/tincan-plugin.zip --universal --node-driver (Get-Command node).Source
      - name: Verify native Cursor package
        if: runner.os != 'Windows'
        run: python scripts/smoke-plugin.py dist/releases/tincan-cursor-plugin.zip --universal
      - name: Verify native Cursor package on Windows
        if: runner.os == 'Windows'
        run: python scripts/smoke-plugin.py dist/releases/tincan-cursor-plugin.zip --universal --node-driver (Get-Command node).Source
  codex-install:
    needs: build
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-14, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install -g @openai/codex@0.153.4
      - uses: actions/download-artifact@v4
        with:
          name: universal-plugin
          path: dist/releases
      - name: Verify actual Codex installation and tool discovery
        if: runner.os != 'Windows'
        run: |
          python scripts/smoke-harness-install.py dist/releases/tincan-plugin.zip --host codex
          python scripts/smoke-harness-install.py dist/releases/tincan-codex-plugin.zip --host codex
      - name: Verify Codex installation with native Windows process resolution
        if: runner.os == 'Windows'
        run: |
          python scripts/smoke-harness-install.py dist/releases/tincan-plugin.zip --host codex --node-driver (Get-Command node).Source
          python scripts/smoke-harness-install.py dist/releases/tincan-codex-plugin.zip --host codex --node-driver (Get-Command node).Source
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [smoke, codex-install]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: publish-plugin
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: universal-plugin
          path: dist/releases
      - run: python3 scripts/publish-marketplace.py dist/releases/tincan-plugin.zip --codex-archive dist/releases/tincan-codex-plugin.zip
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/releases/*
          fail_on_unmatched_files: true
          prerelease: ${{ contains(github.ref_name, '-') }}
